name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRIVA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error

      - name: Install standalone artifacts
        run: cmake --install build --config ${{ matrix.build_type }} --prefix install

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riva-${{ runner.os }}-${{ matrix.build_type }}
          path: install

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure sanitized build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DRIVA_ENABLE_SANITIZERS=ON
          -DRIVA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel 4

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure --no-tests=error

  clang-and-static-analysis:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure strict Clang build
        run: >-
          cmake -S . -B build-clang
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DRIVA_WARNINGS_AS_ERRORS=ON

      - name: Build with warnings as errors
        run: cmake --build build-clang --parallel 4

      - name: Test
        run: ctest --test-dir build-clang --output-on-failure --no-tests=error

      - name: Install Clang tooling
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run Clang static analyzer
        run: >-
          run-clang-tidy -p build-clang -j 2 -quiet
          -checks=-*,clang-analyzer-*
          -warnings-as-errors=*
